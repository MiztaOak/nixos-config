# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# start with window 1
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# shorten command delay
set -sg escape-time 1

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# reload config file
bind r source-file ~/.tmux.conf

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# Vim like navigation
set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# set default terminal mode to 256 colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

#-----------------------------------------------------
# DESIGN TWEAKS
#-----------------------------------------------------

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none


set -g status-justify "left"
set -g status "on"
set -g status-left-style "none"
set -g message-command-style "fg=#4f3829,bg=#e5d5ad"
set -g status-right-style "none"
set -g pane-active-border-style "fg=#7c6f64"
set -g status-style "none,bg=#f2e5bc"
set -g message-style "fg=#4f3829,bg=#e5d5ad"
set -g pane-border-style "fg=#e5d5ad"
set -g status-right-length "100"
set -g status-left-length "100"
setw -g window-status-activity-style "none"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#4f3829,bg=#f2e5bc"
set -g status-left "#[fg=#fbf1c7,bg=#7c6f64,bold] #S #[fg=#7c6f64,bg=#f2e5bc,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#e5d5ad,bg=#f2e5bc,nobold,nounderscore,noitalics]#[fg=#4f3829,bg=#e5d5ad] %Y-%m-%d  %H:%M #[fg=#7c6f64,bg=#e5d5ad,nobold,nounderscore,noitalics]#[fg=#fbf1c7,bg=#7c6f64,bold] #h "
setw -g window-status-format "#[fg=#4f3829,bg=#f2e5bc] #I #[fg=#4f3829,bg=#f2e5bc] #W "
setw -g window-status-current-format "#[fg=#f2e5bc,bg=#e5d5ad,nobold,nounderscore,noitalics]#[fg=#4f3829,bg=#e5d5ad] #I #[fg=#4f3829,bg=#e5d5ad] #W #[fg=#e5d5ad,bg=#f2e5bc,nobold,nounderscore,noitalics]"